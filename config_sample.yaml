nas:
  mount_point: "/mnt/photos"    # NAS mount point or local folder

default_playlist: "all"

# Global excludes — photos matching these are hidden from all playlists
# exclude:
#   people: ["PersonToHide"]
#   keywords: ["keyword-to-hide"]

display:
  fit_mode: "fit"              # fit | fill | ken_burns
  background: "blur"           # black | blur
  transition: "fade"           # fade | slide | none
  transition_duration_secs: 1.5
  interval_secs: 30
  shuffle: true
  show_info_overlay: false

schedule:
  night_mode:
    enabled: true
    start: "21:00"
    end: "06:00"
    brightness: 0.3
  power_save:
    enabled: true
    start: "23:00"
    end: "07:00"

history:
  enabled: true
  max_entries: 500
  allow_rating_changes: true

# Downscaled-image cache. The frame is served local, downscaled copies instead
# of full-resolution originals, which the Pi's GPU decodes and composites much
# faster at 4K. Kept on local disk (never the NAS) and bounded by max_bytes.
cache:
  dir: "cache"              # local disk, relative to the app directory
  max_edge: 3840            # foreground long-edge target in px (4K); larger images
                            # are downscaled to this, smaller ones served as-is
  bg_edge: 320              # blurred-background thumbnail long-edge in px
  jpeg_quality: 85
  max_bytes: 16000000000    # ~15 GB hard cap; least-recently-shown files evicted

playlists:
  all:
    name: "All Photos"
    filter: {}

  favorites:
    name: "Favorites (4+ stars)"
    filter:
      rating: { gte: 4 }
    fit_mode: "ken_burns"
    interval_secs: 15          # per-playlist overrides
    # shuffle: false
    # exclude:
    #   people: ["SomePerson"]

  family:
    name: "Family Photos"
    filter:
      people: { any: ["Alice", "Bob", "Charlie"] }

  vacation:
    name: "Vacation"
    filter:
      keywords: { any: ["vacation", "travel"] }

  best-of-kids:
    name: "Best Kid Photos"
    filter:
      rating: { gte: 3 }
      people: { any: ["Alice", "Bob"] }

  recent:
    name: "Recent Photos"
    filter:
      date_taken:
        gte: "2024-01-01"

  # year-2023:
  #   name: "2023 Photos"
  #   filter:
  #     date_taken:
  #       gte: "2023-01-01"
  #       lte: "2023-12-31"
